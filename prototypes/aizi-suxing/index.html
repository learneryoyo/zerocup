<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>开酥 · 荆门酥饼制作体验</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23f2e6cd'/%3E%3Ccircle cx='32' cy='32' r='19' fill='%23d9a559'/%3E%3Ccircle cx='32' cy='32' r='9' fill='%23fbf3e0'/%3E%3C/svg%3E">
</head>
<body data-step="roll">

<main class="page">
  <header class="game-head">
    <div class="title-block">
      <p class="eyebrow"><a href="../../site/revival.html">← 七艺新生</a><span>食物手艺小样</span></p>
      <h1>开酥 <i>·</i> <span>荆门酥饼制作体验</span></h1>
    </div>
    <div class="actions">
      <button id="autoBtn" class="btn ghost" type="button">自动完成</button>
      <button id="resetBtn" class="btn" type="button">重来</button>
    </div>
  </header>

  <ol class="steps" id="stepRail" aria-label="制作步骤">
    <li data-step="roll"><b>1</b><span>擀皮</span></li>
    <li data-step="fold"><b>2</b><span>抹酥</span></li>
    <li data-step="fill"><b>3</b><span>包馅</span></li>
    <li data-step="sesame"><b>4</b><span>芝麻</span></li>
    <li data-step="bake"><b>5</b><span>上铛</span></li>
  </ol>

  <section class="stage" id="stageWrap" aria-label="酥饼制作台">
    <svg id="stage" viewBox="0 0 900 600" preserveAspectRatio="xMidYMid meet" role="group"
         aria-label="拖拽制作荆门酥饼">
      <defs>
        <linearGradient id="paperG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f8f0de"/>
          <stop offset=".55" stop-color="#f2e6cd"/>
          <stop offset="1" stop-color="#e9d7b5"/>
        </linearGradient>
        <radialGradient id="doughTopG" cx="36%" cy="30%" r="82%">
          <stop offset="0" stop-color="#fdf5df"/>
          <stop offset=".62" stop-color="#f4e3bb"/>
          <stop offset="1" stop-color="#e2c68e"/>
        </radialGradient>
        <linearGradient id="doughSideG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#e8d0a0"/>
          <stop offset="1" stop-color="#c8a16a"/>
        </linearGradient>
        <linearGradient id="woodG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#e6c69b"/>
          <stop offset=".5" stop-color="#dcb98c"/>
          <stop offset="1" stop-color="#cda473"/>
        </linearGradient>
        <radialGradient id="bowlG" cx="34%" cy="18%" r="86%">
          <stop offset="0" stop-color="#fbf6ea"/>
          <stop offset=".7" stop-color="#e9dfcc"/>
          <stop offset="1" stop-color="#cfc0a5"/>
        </radialGradient>
        <radialGradient id="fillingG" cx="38%" cy="30%" r="80%">
          <stop offset="0" stop-color="#8d5731"/>
          <stop offset=".55" stop-color="#6d3d21"/>
          <stop offset="1" stop-color="#4a2716"/>
        </radialGradient>
        <radialGradient id="bunSheenG" cx="36%" cy="26%" r="70%">
          <stop offset="0" stop-color="#fffdf4" stop-opacity=".75"/>
          <stop offset=".7" stop-color="#fff8e6" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="ironRim" cx="38%" cy="30%" r="75%">
          <stop offset="0" stop-color="#6d6152"/>
          <stop offset=".75" stop-color="#4b4238"/>
          <stop offset="1" stop-color="#322b24"/>
        </radialGradient>
        <radialGradient id="ironInner" cx="42%" cy="36%" r="72%">
          <stop offset="0" stop-color="#6f5b44"/>
          <stop offset=".65" stop-color="#55463a"/>
          <stop offset="1" stop-color="#3b3128"/>
        </radialGradient>
        <linearGradient id="plateG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fdf7e9"/>
          <stop offset="1" stop-color="#ecdfc4"/>
        </linearGradient>
        <filter id="grain" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency=".86" numOctaves="2" stitchTiles="stitch"/>
          <feColorMatrix type="saturate" values="0"/>
          <feComponentTransfer><feFuncA type="table" tableValues="0 .16"/></feComponentTransfer>
        </filter>
        <filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
        <filter id="blur4"><feGaussianBlur stdDeviation="4"/></filter>
        <clipPath id="doughClip"><ellipse id="doughClipEllipse" cx="0" cy="0" rx="196" ry="54"/></clipPath>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="#ab7238"/>
        </marker>
      </defs>

      <!-- 纸面 -->
      <rect width="900" height="600" fill="url(#paperG)"/>
      <rect width="900" height="600" filter="url(#grain)" opacity=".5" style="mix-blend-mode:multiply"/>
      <rect x="18" y="18" width="864" height="564" rx="28" fill="none" stroke="#cbb48d" stroke-width="1.5" stroke-dasharray="1 7" opacity=".7"/>
      <rect x="30" y="30" width="840" height="540" rx="22" fill="none" stroke="#e8d8ba" stroke-width="1"/>

      <!-- 角落印记 -->
      <g transform="translate(836 524) rotate(-6)" opacity=".82">
        <rect x="-25" y="-25" width="50" height="50" rx="6" fill="none" stroke="#a8503a" stroke-width="2"/>
        <text x="0" y="9" text-anchor="middle" font-family="KaiTi, STKaiti, serif" font-size="30" fill="#a8503a">酥</text>
      </g>
      <text x="52" y="566" font-family="KaiTi, STKaiti, serif" font-size="15" fill="#9b805c" letter-spacing="4">荆门 · 手工酥饼</text>

      <!-- 案板 -->
      <g id="board">
        <ellipse cx="280" cy="368" rx="252" ry="150" fill="#7c4f22" opacity=".18" filter="url(#blur8)"/>
        <ellipse cx="280" cy="352" rx="252" ry="150" fill="url(#woodG)" stroke="#b08050" stroke-width="3"/>
        <ellipse cx="280" cy="352" rx="238" ry="137" fill="none" stroke="#d6b183" stroke-width="1.5" opacity=".75"/>
        <g fill="none" stroke="#c49a69" stroke-width="1.4" opacity=".55">
          <path d="M76 300 C160 282 300 286 458 306"/>
          <path d="M64 344 C170 330 310 332 486 350"/>
          <path d="M70 392 C180 380 320 384 476 398"/>
          <path d="M120 430 C220 420 330 422 430 434"/>
        </g>
        <path d="M480 268 q 22 6 30 26" fill="none" stroke="#b78c5c" stroke-width="2" opacity=".6"/>
      </g>

      <!-- 面皮 / 油酥 / 收口 -->
      <g id="dough" style="transform: translate(300px, 330px)">
        <ellipse id="doughShadow" cy="20" rx="190" ry="58" fill="#6b4520" opacity=".13" filter="url(#blur4)"/>
        <g id="doughInner">
          <ellipse id="doughSide" cy="8" rx="196" ry="54" fill="url(#doughSideG)"/>
          <ellipse id="doughTop" rx="196" ry="54" fill="url(#doughTopG)" stroke="#d8bb88" stroke-width="2"/>
          <ellipse rx="188" ry="47" fill="none" stroke="#fbf1d7" stroke-width="1.5" opacity=".55" stroke-dasharray="22 12"/>
          <g fill="none" stroke="#d9bd8c" stroke-width="1.6" stroke-linecap="round" opacity=".75">
            <path d="M-84 -20 q 34 12 66 2"/>
            <path d="M-18 26 q 40 10 78 -4"/>
            <path d="M62 -24 q 26 10 48 2"/>
          </g>
          <g id="oilSheen" clip-path="url(#doughClip)" opacity="0">
            <ellipse rx="182" ry="48" fill="#eccb84" opacity=".55"/>
            <path d="M-150 -14 C-90 6 -20 -10 40 4 S 140 -6 170 8" fill="none" stroke="#f4daa0" stroke-width="18" stroke-linecap="round" opacity=".7"/>
            <path d="M-160 14 C-80 26 0 10 70 20 S 150 12 168 18" fill="none" stroke="#e8c07a" stroke-width="14" stroke-linecap="round" opacity=".6"/>
          </g>
          <g id="oilMarks" clip-path="url(#doughClip)"></g>
          <g id="fillingMound" class="is-hidden">
            <ellipse rx="96" ry="46" fill="url(#fillingG)"/>
            <g fill="#3f2113" opacity=".7">
              <circle cx="-42" cy="-8" r="5"/><circle cx="-8" cy="12" r="4"/>
              <circle cx="30" cy="-14" r="5"/><circle cx="56" cy="10" r="3.6"/>
              <circle cx="4" cy="-22" r="3.2"/>
            </g>
            <ellipse rx="50" ry="20" cx="-18" cy="-12" fill="#a06a43" opacity=".28"/>
          </g>
          <g id="sealDots"></g>
      <ellipse id="sealArc" rx="51" ry="186" fill="none" stroke="#b56a2b" stroke-width="5"
                   pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"
                   stroke-linecap="round" transform="rotate(-90)" opacity="0"/>
        </g>
        <path id="foldCrease" d="M0 -56 Q 8 0 0 56" fill="none" stroke="#c08a4e" stroke-width="2.5"
              stroke-dasharray="5 6" opacity="0"/>
      </g>

      <!-- 擀面杖 -->
      <g id="pin" class="draggable is-hidden" style="transform: translate(300px, 242px)">
        <ellipse cy="26" rx="176" ry="16" fill="#6b4520" opacity=".16" filter="url(#blur4)"/>
        <g>
          <rect x="-168" y="-17" width="336" height="34" rx="17" fill="#d9b077" stroke="#a9793f" stroke-width="2"/>
          <rect x="-156" y="-11" width="312" height="9" rx="4.5" fill="#f0d5a8" opacity=".7"/>
          <rect x="-150" y="4" width="300" height="6" rx="3" fill="#b7874f" opacity=".5"/>
          <g fill="#9c6d39">
            <rect x="-198" y="-10" width="30" height="20" rx="9"/>
            <rect x="168" y="-10" width="30" height="20" rx="9"/>
          </g>
          <g fill="#f3e2c4" stroke="#b08850" stroke-width="1.5">
            <ellipse cx="-198" cy="0" rx="9" ry="14"/>
            <ellipse cx="198" cy="0" rx="9" ry="14"/>
          </g>
        </g>
        <ellipse class="halo" cx="0" cy="0" rx="196" ry="42"/>
        <rect class="hit" x="-205" y="-34" width="410" height="68" fill="transparent"/>
      </g>

      <!-- 油酥碟与油刷 -->
      <g id="oilDish" class="is-hidden" style="transform: translate(604px, 288px)">
        <ellipse cy="16" rx="66" ry="38" fill="#6b4520" opacity=".13"/>
        <ellipse rx="64" ry="36" fill="#eee3cd" stroke="#c6b393" stroke-width="2"/>
        <ellipse rx="48" ry="24" fill="#e6c37a" stroke="#cf9f4e" stroke-width="1.5"/>
        <ellipse cx="-12" cy="-5" rx="18" ry="7" fill="#f6dd9d" opacity=".8"/>
      </g>
      <g id="brush" class="draggable is-hidden" style="transform: translate(600px, 258px)">
        <g id="brushInner" transform="rotate(18)">
          <ellipse cy="46" rx="30" ry="10" fill="#6b4520" opacity=".14"/>
          <rect x="-11" y="-70" width="22" height="92" rx="9" fill="#b9854e" stroke="#8a5b2c" stroke-width="2"/>
          <rect x="-11" y="-64" width="7" height="78" rx="3.5" fill="#d9ad77" opacity=".7"/>
          <rect x="-20" y="18" width="40" height="22" rx="6" fill="#dcc8a2" stroke="#b49a6f" stroke-width="1.5"/>
          <path d="M-19 38 q 19 22 38 0 l -4 16 q -15 12 -30 0 z" fill="#e9d7b2" stroke="#c6ae83" stroke-width="1.4"/>
          <path d="M-12 44 v 10 M0 46 v 12 M12 44 v 10" stroke="#c6ae83" stroke-width="1.2"/>
          <ellipse class="halo" cx="0" cy="-8" rx="34" ry="78"/>
        </g>
        <rect class="hit" x="-62" y="-96" width="124" height="184" fill="transparent"/>
      </g>

      <!-- 馅料碗 -->
      <g id="bowl" class="is-hidden" style="transform: translate(700px, 336px)">
        <ellipse cy="18" rx="110" ry="38" fill="#6b4520" opacity=".16"/>
        <path d="M-104 0 C-100 74 -56 106 0 106 C56 106 100 74 104 0 Z" fill="url(#bowlG)" stroke="#b9a88b" stroke-width="2"/>
        <ellipse cy="2" rx="104" ry="31" fill="#6a4127"/>
        <g>
          <ellipse cx="-38" cy="-4" rx="30" ry="20" fill="#7b4a28"/>
          <ellipse cx="20" cy="-8" rx="36" ry="22" fill="#875532"/>
          <ellipse cx="62" cy="4" rx="22" ry="15" fill="#734224"/>
          <g fill="#40200f" opacity=".65">
            <circle cx="-46" cy="-6" r="3.4"/><circle cx="-24" cy="4" r="2.6"/>
            <circle cx="14" cy="-10" r="3.2"/><circle cx="36" cy="0" r="2.8"/>
            <circle cx="60" cy="2" r="2.4"/>
          </g>
        </g>
        <ellipse rx="104" ry="31" fill="none" stroke="#e9dfcc" stroke-width="9"/>
        <ellipse rx="104" ry="31" fill="none" stroke="#c8b89c" stroke-width="1.4"/>
      </g>

      <!-- 可拖拽馅团 -->
      <g id="fillingBall" class="draggable is-hidden" style="transform: translate(700px, 300px)">
        <ellipse cy="26" rx="30" ry="10" fill="#4a2a14" opacity=".18"/>
        <circle r="34" fill="url(#fillingG)" stroke="#4a2716" stroke-width="2"/>
        <ellipse cx="-10" cy="-12" rx="12" ry="8" fill="#a06a43" opacity=".45"/>
        <g fill="#3a1c0d" opacity=".7">
          <circle cx="10" cy="-6" r="3"/><circle cx="-14" cy="10" r="2.4"/><circle cx="16" cy="16" r="2.2"/>
        </g>
        <circle class="halo" r="44"/>
        <circle class="hit" r="40" fill="transparent"/>
      </g>

      <!-- 折边抓手 -->
      <g id="foldHandle" class="draggable is-hidden" style="transform: translate(200px, 0px)">
        <path d="M0 -34 L 30 0 L 0 34 Q 14 0 0 -34 Z" fill="#f7ecd4" stroke="#b57a3a" stroke-width="2.5"/>
        <path d="M10 0 l -7 -7 M10 0 l -7 7" stroke="#a9682c" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <circle class="halo" r="40"/>
        <circle class="hit" r="42" fill="transparent"/>
      </g>

      <!-- 收口抓手 -->
      <g id="sealHandle" class="draggable is-hidden" style="transform: translate(0px, -58px)">
        <g>
          <ellipse cx="-7" cy="2" rx="14" ry="10" fill="#f3e3bf" stroke="#b9823f" stroke-width="2"/>
          <ellipse cx="7" cy="0" rx="13" ry="9" fill="#f8ecd2" stroke="#b9823f" stroke-width="2"/>
          <circle cy="-4" r="3" fill="#c08a4e"/>
        </g>
        <circle class="halo" r="34"/>
        <circle class="hit" r="38" fill="transparent"/>
      </g>

      <!-- 饼铛 -->
      <g id="pan" class="is-hidden" style="transform: translate(660px, 352px)">
        <ellipse cy="18" rx="156" ry="118" fill="#5d3a1a" opacity=".18" filter="url(#blur8)"/>
        <circle r="144" fill="url(#ironRim)" stroke="#2d2721" stroke-width="6"/>
        <circle r="124" fill="url(#ironInner)" stroke="#211c17" stroke-width="3"/>
        <circle r="102" fill="none" stroke="#8a6a44" stroke-width="2" stroke-dasharray="3 11" opacity=".45"/>
        <g fill="#3a3128" stroke="#2b241d" stroke-width="1.5">
          <rect x="-24" y="-166" width="48" height="26" rx="12"/>
          <rect x="-24" y="140" width="48" height="26" rx="12"/>
        </g>
        <circle id="panHot" r="132" fill="none" stroke="#e08a3c" stroke-width="4" opacity="0"/>
        <g id="panSteam" class="is-hidden" fill="none" stroke="#fdf6e6" stroke-width="6" stroke-linecap="round" opacity=".55">
          <path class="steam s1" d="M-56 -80 C -74 -112 -38 -128 -54 -160"/>
          <path class="steam s2" d="M4 -92 C -14 -128 22 -142 6 -176"/>
          <path class="steam s3" d="M58 -76 C 40 -108 76 -126 60 -156"/>
        </g>
      </g>

      <!-- 饼 -->
      <g id="bun" class="draggable is-hidden" style="transform: translate(300px, 330px)">
        <ellipse id="bunShadow" cy="24" rx="94" ry="26" fill="#5d3a1a" opacity=".18"/>
        <ellipse id="bunGlow" cy="8" rx="126" ry="92" fill="#e0893c" opacity="0" filter="url(#blur8)"/>
        <g id="bunInner">
          <ellipse id="bunBody" rx="94" ry="58" fill="#f4e6c4" stroke="#c9a468" stroke-width="2"/>
          <ellipse rx="94" ry="58" fill="url(#bunSheenG)"/>
          <g id="bunPleats" fill="none" stroke="#c9a468" stroke-width="1.6" stroke-linecap="round" opacity=".8"></g>
          <g id="charSpots" opacity="0">
            <ellipse cx="-42" cy="-20" rx="18" ry="10" fill="#4b2a12" opacity=".5"/>
            <ellipse cx="34" cy="14" rx="22" ry="12" fill="#4b2a12" opacity=".4"/>
            <ellipse cx="0" cy="-36" rx="12" ry="7" fill="#4b2a12" opacity=".35"/>
          </g>
          <g id="seedLayer"></g>
          <circle id="leakDrop" cx="66" cy="34" r="5" fill="#9a5527" opacity="0"/>
          <ellipse class="halo" rx="110" ry="72"/>
        </g>
        <ellipse class="hit" rx="96" ry="62" fill="transparent"/>
      </g>

      <!-- 芝麻罐 -->
      <g id="jar" class="draggable is-hidden" style="transform: translate(700px, 336px)">
        <ellipse cy="62" rx="46" ry="13" fill="#6b4520" opacity=".16"/>
        <g id="jarInner">
          <rect x="-44" y="-48" width="88" height="106" rx="20" fill="#f0e5d0" stroke="#b9a582" stroke-width="2"/>
          <rect x="-33" y="-30" width="66" height="60" rx="12" fill="#e2d2b3" stroke="#cbb894" stroke-width="1.5"/>
          <g fill="#33281f">
            <ellipse cx="-18" cy="-14" rx="3" ry="2"/><ellipse cx="0" cy="-8" rx="3" ry="2"/>
            <ellipse cx="18" cy="-16" rx="3" ry="2"/><ellipse cx="-8" cy="2" rx="3" ry="2"/>
            <ellipse cx="14" cy="6" rx="3" ry="2"/><ellipse cx="-20" cy="14" rx="3" ry="2"/>
            <ellipse cx="4" cy="18" rx="3" ry="2"/><ellipse cx="24" cy="16" rx="3" ry="2"/>
          </g>
          <text x="0" y="46" text-anchor="middle" font-family="KaiTi, STKaiti, serif" font-size="14" fill="#9a815d">芝麻</text>
          <rect x="-46" y="-56" width="92" height="15" rx="7" fill="#b7834a" stroke="#8d6033" stroke-width="1.5"/>
          <ellipse cx="0" cy="-56" rx="34" ry="7" fill="#9c6c3a"/>
          <ellipse class="halo" cx="0" cy="10" rx="60" ry="70"/>
        </g>
        <rect class="hit" x="-52" y="-64" width="104" height="136" fill="transparent"/>
      </g>

      <!-- 起锅盘 -->
      <g id="plate" class="is-hidden" style="transform: translate(800px, 116px)">
        <ellipse cy="14" rx="92" ry="38" fill="#5d3a1a" opacity=".16" filter="url(#blur4)"/>
        <ellipse rx="88" ry="36" fill="url(#plateG)" stroke="#d3bf9c" stroke-width="2"/>
        <ellipse rx="68" ry="26" fill="none" stroke="#e3d3b4" stroke-width="2"/>
        <circle cx="-64" cy="8" r="3" fill="#d3bf9c"/>
      </g>

      <!-- 火候尺 -->
      <g id="gauge" class="is-hidden" style="transform: translate(500px, 160px)">
        <rect x="-19" y="-100" width="38" height="200" rx="19" fill="#f5ebd6" stroke="#cbb68e" stroke-width="2"/>
        <rect x="-11" y="-32" width="22" height="52" fill="#d9a559" opacity=".55"/>
        <rect x="-11" y="-84" width="22" height="52" fill="#a9602c" opacity=".3"/>
        <line x1="-11" y1="28" x2="11" y2="28" stroke="#b98a4c" stroke-width="1.5" stroke-dasharray="2 3"/>
        <line id="gaugeNeedle" x1="-15" y1="92" x2="15" y2="92" stroke="#5b3a1d" stroke-width="4" stroke-linecap="round"/>
        <text x="0" y="-110" text-anchor="middle" font-family="KaiTi, STKaiti, serif" font-size="13" fill="#8a6d48">火候</text>
        <text x="0" y="118" text-anchor="middle" font-family="KaiTi, STKaiti, serif" font-size="10" fill="#a58c68">生</text>
        <text x="0" y="-90" text-anchor="middle" font-family="KaiTi, STKaiti, serif" font-size="10" fill="#a58c68">焦</text>
      </g>

      <!-- 引导 -->
      <g id="hintRoll" class="hint">
        <path d="M166 190 H 438" fill="none" stroke="#ab7238" stroke-width="2" stroke-dasharray="6 8" marker-start="url(#arrow)" marker-end="url(#arrow)" opacity=".8"/>
        <text x="302" y="178" text-anchor="middle" font-family="KaiTi, STKaiti, serif" font-size="13" fill="#a17849" letter-spacing="2">来回擀</text>
      </g>
      <g id="hintOil" class="hint">
        <path d="M566 286 C 500 300 450 318 408 328" fill="none" stroke="#ab7238" stroke-width="2" stroke-dasharray="6 8" marker-end="url(#arrow)" opacity=".8"/>
        <text x="500" y="312" text-anchor="middle" font-family="KaiTi, STKaiti, serif" font-size="13" fill="#a17849">抹油酥</text>
      </g>
      <g id="hintFold" class="hint">
        <path id="hintFoldPath" d="" fill="none" stroke="#ab7238" stroke-width="2" stroke-dasharray="6 8" marker-end="url(#arrow)" opacity=".85"/>
        <text id="hintFoldText" x="420" y="318" text-anchor="middle" font-family="KaiTi, STKaiti, serif" font-size="13" fill="#a17849">折过来</text>
      </g>
      <g id="hintFill" class="hint">
        <path d="M660 292 C 540 268 420 292 356 320" fill="none" stroke="#ab7238" stroke-width="2" stroke-dasharray="6 8" marker-end="url(#arrow)" opacity=".8"/>
        <text x="520" y="276" text-anchor="middle" font-family="KaiTi, STKaiti, serif" font-size="13" fill="#a17849">拖一团馅</text>
      </g>
      <g id="hintSeal" class="hint" style="transform: translate(300px, 330px)">
        <ellipse id="sealHintEllipse" rx="96" ry="60" fill="none" stroke="#ab7238" stroke-width="2.5" stroke-dasharray="7 9" opacity=".8"/>
        <text x="300" y="430" text-anchor="middle" font-family="KaiTi, STKaiti, serif" font-size="13" fill="#a17849">沿边收口</text>
      </g>
      <g id="hintSesame" class="hint">
        <path d="M356 286 q 30 -20 60 0 t 60 0 t 60 0" fill="none" stroke="#ab7238" stroke-width="2" stroke-dasharray="6 8" opacity=".8"/>
        <text x="430" y="268" text-anchor="middle" font-family="KaiTi, STKaiti, serif" font-size="13" fill="#a17849">芝麻罐扫一扫</text>
      </g>
      <g id="hintPan" class="hint">
        <path d="M404 330 C 480 330 520 348 566 352" fill="none" stroke="#ab7238" stroke-width="2" stroke-dasharray="6 8" marker-end="url(#arrow)" opacity=".8"/>
        <text x="478" y="318" text-anchor="middle" font-family="KaiTi, STKaiti, serif" font-size="13" fill="#a17849">拖进饼铛</text>
      </g>
      <g id="hintFlip" class="hint is-hidden">
        <path d="M660 268 V 206" fill="none" stroke="#ab7238" stroke-width="2.5" stroke-dasharray="6 8" marker-end="url(#arrow)" opacity=".9"/>
        <text x="676" y="226" font-family="KaiTi, STKaiti, serif" font-size="13" fill="#a17849">向上拖起翻面</text>
      </g>
      <g id="hintPlate" class="hint is-hidden">
        <path d="M736 222 C 770 200 790 190 806 172" fill="none" stroke="#ab7238" stroke-width="2.5" stroke-dasharray="6 8" marker-end="url(#arrow)" opacity=".9"/>
        <text x="700" y="200" text-anchor="middle" font-family="KaiTi, STKaiti, serif" font-size="13" fill="#a17849">拖到盘里起锅</text>
      </g>
    </svg>

    <div class="hud">
      <p class="hud-text" id="statusText">拖住擀面杖，左右来回擀</p>
      <div class="meter">
        <span id="meterLabel">面皮厚度</span>
        <div class="bar"><i id="meterFill"></i></div>
        <span id="meterValue">0%</span>
      </div>
    </div>
    <p class="toast" id="toast" role="status" aria-live="polite"></p>
  </section>

  <p class="footnote">以湖北荆门矮子馅饼的开酥、包馅、上铛手法为原型 · 图形均为手绘 SVG，不采用实物照片</p>
</main>

<div class="result-layer" id="resultLayer" hidden>
  <section class="result-card" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
    <div class="result-top">
      <p class="eyebrow">切开这一块</p>
      <h2 id="resultTitle">酥皮开口，热气还在</h2>
      <p class="result-rank" id="resultRank">酥得掉渣</p>
      <p class="result-note" id="resultNote"></p>
    </div>

    <div class="result-art">
      <svg class="cross" viewBox="0 0 440 250" role="img" aria-label="酥饼横截面，可见分层外皮、深色馅心与表面芝麻">
        <defs>
          <linearGradient id="crossBread" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f4ddb0"/>
            <stop offset="1" stop-color="#e2bc80"/>
          </linearGradient>
          <radialGradient id="crossFillG" cx="42%" cy="32%" r="72%">
            <stop offset="0" stop-color="#8a4f2c"/>
            <stop offset=".6" stop-color="#66371d"/>
            <stop offset="1" stop-color="#4a2716"/>
          </radialGradient>
          <clipPath id="crossClip">
            <path d="M42 140 C 54 84 126 58 218 56 C 318 54 390 84 398 138 C 402 176 326 202 222 202 C 128 202 48 178 42 140 Z"/>
          </clipPath>
        </defs>
        <ellipse cx="220" cy="216" rx="176" ry="16" fill="#5d3a1a" opacity=".14"/>
        <g clip-path="url(#crossClip)">
          <path d="M42 140 C 54 84 126 58 218 56 C 318 54 390 84 398 138 C 402 176 326 202 222 202 C 128 202 48 178 42 140 Z" fill="url(#crossBread)"/>
          <g id="crossLayers"></g>
        </g>
        <path id="crossFill" d="M150 132 C 168 110 202 104 230 106 C 270 109 302 118 304 135 C 306 154 272 167 228 165 C 182 163 148 152 150 132 Z" fill="url(#crossFillG)"/>
        <g fill="#3d1d0e" opacity=".55">
          <circle cx="168" cy="128" r="4"/><circle cx="204" cy="146" r="3.4"/>
          <circle cx="252" cy="124" r="4.2"/><circle cx="286" cy="140" r="3"/>
        </g>
        <ellipse cx="180" cy="118" rx="26" ry="11" fill="#a86c40" opacity=".28"/>
        <path id="crossCrust" d="M42 140 C 54 84 126 58 218 56 C 318 54 390 84 398 138" fill="none" stroke="#b8742f" stroke-width="8" stroke-linecap="round"/>
        <path d="M48 142 C 62 92 130 66 216 64 C 310 62 378 90 392 136" fill="none" stroke="#e0aa62" stroke-width="2" opacity=".8"/>
        <g id="crossSesame"></g>
        <g fill="#fbf1d8" opacity=".75">
          <ellipse cx="96" cy="118" rx="9" ry="3.5" transform="rotate(-14 96 118)"/>
          <ellipse cx="334" cy="112" rx="8" ry="3" transform="rotate(12 334 112)"/>
          <ellipse cx="150" cy="176" rx="7" ry="2.8" transform="rotate(-8 150 176)"/>
          <ellipse cx="298" cy="172" rx="7" ry="2.6" transform="rotate(10 298 172)"/>
        </g>
      </svg>
      <span class="layer-chip" id="layerChip">18 层</span>
    </div>

    <div class="metrics">
      <div class="metric">
        <span>开酥完整度</span>
        <div class="track"><i id="metOpen"></i></div>
        <b id="numOpen">0</b>
      </div>
      <div class="metric">
        <span>封口完整度</span>
        <div class="track"><i id="metSeal"></i></div>
        <b id="numSeal">0</b>
      </div>
      <div class="metric">
        <span>火候</span>
        <div class="track"><i id="metHeat"></i></div>
        <b id="numHeat">0</b>
      </div>
    </div>

    <div class="result-actions">
      <button id="againBtn" class="btn solid" type="button">重新来一块</button>
      <p class="result-foot">外皮 · 馅料 · 层次 · 芝麻 · 火候</p>
    </div>
  </section>
</div>

<script src="game.js"></script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>食物 · 糖画纹样预览</title>
  <link rel="stylesheet" href="../assets/css/site.css">
  <link rel="stylesheet" href="../assets/css/category.css">
  <link rel="stylesheet" href="../assets/css/category-food-lab.css">
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>

  <header class="site-header">
    <a class="brand" href="../index.html" aria-label="非遗辑录首页">
      <span class="brand-name">非遗辑录</span>
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-nav"><span>菜单</span></button>
    <nav class="primary-nav" id="primary-nav" aria-label="主导航">
      <a href="../index.html">首页</a>
      <a href="../heritage.html">非遗辑录</a>
      <a href="../revival.html">古艺新生</a>
      <a href="../about.html">关于我们</a>
    </nav>
  </header>

  <main id="main-content" class="category-page" data-accent="food" data-crop="lotus" tabindex="-1">
    <section class="category-hero">
      <div class="category-shell">
        <div class="category-hero__inner">
          <div class="food-title">
            <span class="tanghua" aria-hidden="true"></span>
            <p class="cat-eyebrow">贰 · 荆楚食味</p>
            <h1>食物</h1>
            <p class="cat-sub">碱水面的筋道、酥皮的开层、鱼茸的上劲、蒸青的几十秒，都靠人一代代试出来、传下来。</p>
            <ul class="cat-facts" aria-label="本辑代表项目">
              <li>热干面</li>
              <li>矮子馅饼</li>
              <li>荆州鱼糕</li>
              <li>恩施玉露</li>
            </ul>
          </div>
          <figure class="category-hero__media">
            <img src="food/jingmen-aizi-pastry/images/aizi-07-finished-video.jpg" alt="出锅的荆门矮子馅饼，饼面粘满芝麻" fetchpriority="high">
            <figcaption>荆门矮子馅饼</figcaption>
          </figure>
        </div>
      </div>
    </section>

    <section class="category-intro" aria-label="分类介绍">
      <div class="category-shell">
        <p>
          湖北的食物非遗，长在水网、码头与市井里：清晨的过早、宴席的头菜、茶山的蒸汽、糖坊的拉扯。它们不是一份菜谱，而是把一方水土变成日常口味的手上功夫。本页先收四个项目：武汉的过早、荆门的酥饼、荆州的宴席头菜、恩施的蒸青绿茶。
        </p>
      </div>
    </section>
  </main>

  <!-- 仅预览用：切换糖画露出的局部 -->
  <div class="lab-switch" role="group" aria-label="纹样局部">
    <button type="button" data-set="lotus" aria-pressed="true">A 莲花鱼首</button>
    <button type="button" data-set="wave" aria-pressed="false">B 鱼尾卷波</button>
    <button type="button" data-set="pod" aria-pressed="false">C 莲蓬斜角</button>
  </div>

  <footer class="site-footer">
    <p>非遗辑录 <span aria-hidden="true">×</span> 2026</p>
    <nav aria-label="页脚导航">
      <a href="../index.html">首页</a><a href="../heritage.html">非遗辑录</a><a href="../revival.html">古艺新生</a><a href="../about.html">关于我们</a>
    </nav>
  </footer>

  <script src="../assets/js/site.js"></script>
  <script>
    (() => {
      const main = document.querySelector("main");
      const buttons = document.querySelectorAll(".lab-switch button");
      buttons.forEach((btn) => btn.addEventListener("click", () => {
        main.dataset.crop = btn.dataset.set;
        buttons.forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
      }));
    })();
  </script>
</body>
</html>

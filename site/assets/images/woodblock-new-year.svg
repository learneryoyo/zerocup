<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">木版年画主题原创占位图</title>
  <desc id="desc">米黄纸底上朱红与靛青交叠的花鸟纹样，作为等待替换的示意插画。</desc>
  <defs>
    <pattern id="grain" width="18" height="22" patternUnits="userSpaceOnUse">
      <path d="M0 4h11M8 16h10" stroke="#583d28" stroke-opacity=".1"/>
    </pattern>
    <g id="leaf"><path d="M0 0Q-90-100 0-140Q90-100 0 0Z" fill="#183b43"/><path d="M0-12v-105" stroke="#dfc48b" stroke-width="4"/></g>
    <g id="flower">
      <g fill="#b43223" stroke="#652b22" stroke-width="3">
        <ellipse cy="-65" rx="45" ry="80"/>
        <ellipse cy="-65" rx="45" ry="80" transform="rotate(45)"/>
        <ellipse cy="-65" rx="45" ry="80" transform="rotate(90)"/>
        <ellipse cy="-65" rx="45" ry="80" transform="rotate(135)"/>
        <ellipse cy="-65" rx="45" ry="80" transform="rotate(180)"/>
        <ellipse cy="-65" rx="45" ry="80" transform="rotate(225)"/>
        <ellipse cy="-65" rx="45" ry="80" transform="rotate(270)"/>
        <ellipse cy="-65" rx="45" ry="80" transform="rotate(315)"/>
      </g>
      <circle r="65" fill="#dfb75e" stroke="#183b43" stroke-width="8"/>
      <circle r="40" fill="none" stroke="#b43223" stroke-width="8" stroke-dasharray="4 8"/>
      <circle r="16" fill="#183b43"/>
    </g>
  </defs>
  <rect width="900" height="1200" fill="#dfc48b"/>
  <rect width="900" height="1200" fill="url(#grain)"/>
  <rect x="38" y="38" width="824" height="1124" fill="none" stroke="#a92d22" stroke-width="14"/>
  <rect x="66" y="66" width="768" height="1068" fill="none" stroke="#183b43" stroke-width="3"/>
  <circle cx="450" cy="530" r="300" fill="none" stroke="#b43223" stroke-width="2"/>
  <path d="M450 1000Q150 600 450 320M450 1000Q740 770 660 490" fill="none" stroke="#183b43" stroke-width="18"/>
  <use href="#leaf" transform="translate(375 810) rotate(-70)"/>
  <use href="#leaf" transform="translate(365 690) rotate(65)"/>
  <use href="#leaf" transform="translate(470 930) rotate(70)"/>
  <use href="#leaf" transform="translate(580 830) rotate(-40)"/>
  <use href="#leaf" transform="translate(650 680) rotate(65)"/>
  <use href="#flower" transform="translate(410 410) scale(1.2)"/>
  <use href="#flower" transform="translate(655 570) scale(.72)"/>
  <use href="#flower" transform="translate(265 715) scale(.6)"/>
  <path d="M160 230Q260 110 350 240Q230 200 190 310L145 365l20-90Z" fill="#183b43"/>
  <path d="m160 230-42-17 26 40M190 310l20 70" fill="#b43223" stroke="#b43223" stroke-width="5"/>
  <circle cx="170" cy="235" r="5" fill="#dfc48b"/>
  <text x="450" y="1080" text-anchor="middle" font-family="serif" font-size="18" letter-spacing="8" fill="#183b43">一 版 一 色 · 岁 岁 更 新</text>
</svg>

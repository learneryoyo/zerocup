<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">木版年画团花示意插画</title>
  <desc id="desc">米黄纸上朱红、藤黄与靛青三色套印的团花图案，外有朱红与靛青双线边框，作为待替换的原创示意插画。</desc>
  <defs>
    <!-- 纸纹：极淡的横向纤维，模拟手工纸 -->
    <pattern id="paperGrain" width="120" height="9" patternUnits="userSpaceOnUse">
      <path d="M0 2h120M0 6h120" stroke="#c8ab79" stroke-opacity=".32" stroke-width="1"/>
    </pattern>
    <!-- 木纹：比纸纹更疏的波纹 -->
    <pattern id="woodGrain" width="900" height="26" patternUnits="userSpaceOnUse">
      <path d="M0 9Q225 4 450 9T900 9M0 20Q225 15 450 20T900 20" fill="none" stroke="#b98f56" stroke-opacity=".16" stroke-width="1.4"/>
    </pattern>
    <!-- 花瓣：以中心为原点、朝上的单片 -->
    <path id="petal" d="M0-50C-72-100-70-198 0-248c70 50 72 148 0 198Z" fill="#b43223" stroke="#7d1f16" stroke-width="3"/>
    <path id="petalInner" d="M0-80c-29-23-29-84 0-107 29 23 29 84 0 107Z" fill="#dfb75e" stroke="#7d1f16" stroke-width="2"/>
  </defs>

  <!-- 纸底 -->
  <rect width="900" height="1200" fill="#e9d3a6"/>
  <rect width="900" height="1200" fill="url(#paperGrain)"/>
  <rect width="900" height="1200" fill="url(#woodGrain)"/>

  <!-- 双线边框 -->
  <rect x="40" y="40" width="820" height="1120" fill="none" stroke="#b43223" stroke-width="16"/>
  <rect x="66" y="66" width="768" height="1068" fill="none" stroke="#183b43" stroke-width="3"/>

  <!-- 团花：先印藤黄版（略偏移，模拟套色错位），再印朱红版 -->
  <g transform="translate(450 495) scale(.78)">
    <g transform="translate(3 4)" opacity=".5">
      <use href="#petal" transform="rotate(0)" fill="#dfb75e" stroke="none"/>
      <use href="#petal" transform="rotate(45)" fill="#dfb75e" stroke="none"/>
      <use href="#petal" transform="rotate(90)" fill="#dfb75e" stroke="none"/>
      <use href="#petal" transform="rotate(135)" fill="#dfb75e" stroke="none"/>
      <use href="#petal" transform="rotate(180)" fill="#dfb75e" stroke="none"/>
      <use href="#petal" transform="rotate(225)" fill="#dfb75e" stroke="none"/>
      <use href="#petal" transform="rotate(270)" fill="#dfb75e" stroke="none"/>
      <use href="#petal" transform="rotate(315)" fill="#dfb75e" stroke="none"/>
    </g>

    <circle r="272" fill="none" stroke="#183b43" stroke-width="3"/>
    <circle r="252" fill="none" stroke="#b43223" stroke-width="2" stroke-dasharray="3 11" stroke-linecap="round"/>

    <g>
      <use href="#petal" transform="rotate(0)"/>
      <use href="#petal" transform="rotate(45)"/>
      <use href="#petal" transform="rotate(90)"/>
      <use href="#petal" transform="rotate(135)"/>
      <use href="#petal" transform="rotate(180)"/>
      <use href="#petal" transform="rotate(225)"/>
      <use href="#petal" transform="rotate(270)"/>
      <use href="#petal" transform="rotate(315)"/>
    </g>
    <g>
      <use href="#petalInner" transform="rotate(0)"/>
      <use href="#petalInner" transform="rotate(45)"/>
      <use href="#petalInner" transform="rotate(90)"/>
      <use href="#petalInner" transform="rotate(135)"/>
      <use href="#petalInner" transform="rotate(180)"/>
      <use href="#petalInner" transform="rotate(225)"/>
      <use href="#petalInner" transform="rotate(270)"/>
      <use href="#petalInner" transform="rotate(315)"/>
    </g>

    <!-- 花心 -->
    <circle r="68" fill="#183b43"/>
    <circle r="45" fill="none" stroke="#e9d3a6" stroke-width="2"/>
    <g fill="#dfb75e">
      <circle cx="0" cy="-54" r="7"/>
      <circle cx="38" cy="-38" r="7"/>
      <circle cx="54" cy="0" r="7"/>
      <circle cx="38" cy="38" r="7"/>
      <circle cx="0" cy="54" r="7"/>
      <circle cx="-38" cy="38" r="7"/>
      <circle cx="-54" cy="0" r="7"/>
      <circle cx="-38" cy="-38" r="7"/>
    </g>
    <circle r="17" fill="#b43223"/>
  </g>
</svg>
